# Heretic searching on the Jev judge instead of refusal keywords: each trial minimises
# the share of responses Jev does not judge harmful, then KL. Position 0 is the most
# harmful trial by Jev on Heretic's own prompts. One cached search, one export per config.
base: &base_cfg
    model_config:
        template: native
        max_generation_length: 1024
        inference_batch_size: 16
    evals: [jev_strong_reject, mmlu_pro_val]
    trial_index: 0
    n_trials: 200
    n_startup_trials: 60
    objective: jev
    max_response_length: 256

pareto_1:
    <<: *base_cfg
    trial_index: 1

pareto_2:
    <<: *base_cfg
    trial_index: 2

pareto_3:
    <<: *base_cfg
    trial_index: 3

pareto_4:
    <<: *base_cfg
    trial_index: 4

pareto_5:
    <<: *base_cfg
    trial_index: 5

pareto_6:
    <<: *base_cfg
    trial_index: 6

pareto_7:
    <<: *base_cfg
    trial_index: 7
